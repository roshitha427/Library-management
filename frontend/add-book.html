<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Book</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Add New Book</h1>
      <form id="book-form" class="form-card">
        <label>Book Title<input type="text" id="title" required /></label>
        <label>Author Name<input type="text" id="author" required /></label>
        <label>Category<input type="text" id="category" required /></label>
        <label>ISBN Number<input type="text" id="isbn" required /></label>
        <label
          >Publication Year<input
            type="number"
            id="year"
            required
            min="1900"
            max="2100"
        /></label>
        <label
          >Quantity<input type="number" id="quantity" required min="1"
        /></label>
        <button type="submit">Submit</button>
      </form>
      <div id="message" class="message"></div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="books.html">View Books</a>
      </div>
    </div>
    <script>
      document
        .getElementById("book-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const book = {
            title: document.getElementById("title").value.trim(),
            author: document.getElementById("author").value.trim(),
            category: document.getElementById("category").value.trim(),
            isbn: document.getElementById("isbn").value.trim(),
            year: Number(document.getElementById("year").value),
            quantity: Number(document.getElementById("quantity").value),
          };

          if (
            !book.title ||
            !book.author ||
            !book.category ||
            !book.isbn ||
            !book.year ||
            !book.quantity
          ) {
            return showMessage("Please fill all fields.", "error");
          }

          const response = await fetch("/books", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(book),
          });

          const data = await response.json();
          if (!response.ok) {
            return showMessage(data.message || "Unable to add book.", "error");
          }

          showMessage("Book added successfully!", "success");
          document.getElementById("book-form").reset();
        });

      function showMessage(text, type) {
        const el = document.getElementById("message");
        el.textContent = text;
        el.className = `message ${type}`;
      }
    </script>
  </body>
</html>
